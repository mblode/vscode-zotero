version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Match engines.vscode; upgrading API types requires a compatibility decision.
      - dependency-name: "@types/vscode"
    groups:
      development:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
